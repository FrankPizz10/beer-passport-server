name: Beer-Passport-Server/CI
on:
  push:
    branches: [master, release/2.0]
  pull_request:
    branches: [master, release/2.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint without modifying the checkout
        run: npx eslint . --ext .ts
      - run: npm run build
      - name: Tests
        run: npm test -- --runInBand
