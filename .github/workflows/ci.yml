name: Beer-Passport-Server/CI
on:
  push:
    branches: [master, release/2.0]
  pull_request:
    branches: [master, release/2.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint changed TypeScript files
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base="origin/$BASE_REF"
          else
            base="$EVENT_BEFORE"
          fi
          if [[ "$base" =~ ^0+$ ]]; then
            echo "No previous revision available; skipping changed-file lint."
            exit 0
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base...$SHA" -- '*.ts')
          if ((${#files[@]} > 0)); then
            npx eslint --ext .ts "${files[@]}"
          else
            echo "No changed TypeScript files to lint."
          fi
      - run: npm run build
      - name: Tests
        run: npm test -- --runInBand
